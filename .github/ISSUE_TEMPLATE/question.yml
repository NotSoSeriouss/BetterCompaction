name: Question / help
description: How to configure something, or help understanding behavior
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Ask away. Include how you've configured the extension and which model/backend you use, if relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you've tried so far
      description: Settings you've changed, commands you've run, and what you've observed.
    validations:
      required: false
